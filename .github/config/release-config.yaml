# Central configuration for all release-related settings

# Package managers to update
package_managers:
  homebrew:
    enabled: true
    tap_repo: "otto-nation/homebrew-tap"
    # The two formulas this repo actually ships, and the only two under
    # Formula/. The second entry used to name a per-command formula that was
    # never written; nothing read it, so it went on naming a file that did not
    # exist through a rename of the command it was named after.
    formulas:
      otto-workbench:
        formula_path: "Formula/otto-workbench.rb"
      otto-ai-tools:
        formula_path: "Formula/otto-ai-tools.rb"

# Notification settings (currently disabled)
notifications:
  enabled: false
