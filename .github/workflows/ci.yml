name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        # Discovery lives in lib/files.sh so CI and the pre-push hook agree
        run: |
          source lib/files.sh
          list_shell_scripts . | xargs shellcheck --severity=warning

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yamllint
        run: pip install yamllint

      - name: YAML lint
        run: yamllint .

      - name: Install zsh
        run: sudo apt-get install -y zsh

      - name: ZSH syntax check
        run: find . -name '*.zsh' -not -path './.git/*' -exec zsh -n {} +

      - name: JSON validation
        run: |
          find . -name '*.json' -not -path './.git/*' -not -path './.claude/*' \
            -exec sh -c 'for f; do jq -e "." "$f" > /dev/null || { echo "Invalid: $f"; exit 1; }; done' _ {} +

  tools-freshness:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install-yq

      - name: Validate conventions
        run: bash bin/local/validate-all

      # The composed docs are covered by bin/local/validate-docs-composed, which
      # the "Validate conventions" step above runs.
      #
      # The rule files these two generators write are gitignored — every machine
      # regenerates them from the registries, so there is no committed copy for
      # them to drift from and nothing a diff could catch. Running the generators
      # is still worth a step: it fails CI when a registry edit breaks one.
      - name: Run the rule-file generators
        run: |
          bash bin/local/generate-tool-context
          bash git/bin/local/generate-git-rules

  test-bats:
    name: Tests (bats)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # zsh is not on the runner image; workbench_roots.bats cross-validates the
      # root chain against the zsh definition in zsh/config.d/aliases/.
      - name: Install bats, parallel, and zsh
        run: sudo apt-get install -y bats parallel zsh

      - uses: ./.github/actions/install-yq

      - name: Install task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Taskfile parses
        run: task --list

      - name: Run bats tests
        run: bin/local/run-tests --bats

      - name: Check tests did not pollute repo config
        run: |
          dirty=false
          for key in user.name user.email; do
            val=$(git config --local "$key" 2>/dev/null) || continue
            echo "::error::Tests left $key=$val in repo .git/config"
            dirty=true
          done
          if $dirty; then
            echo "A test set git config without cd-ing to a temp directory first."
            exit 1
          fi

  test-pytest:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # xdist is what makes the suite parallel; bin/local/run-tests probes for
      # it and falls back to a serial run when it is absent, so the version is
      # pinned here the same way pytest itself is.
      - name: Install pytest
        run: |
          pipx install pytest==8.3.5
          pipx inject pytest pytest-xdist==3.8.0

      # tests/test_tool_registry.py reads the registries through
      # ai/lib/config/workbench_config.py, which uses PyYAML when it is importable and
      # yq otherwise. pipx runs pytest in its own venv, so it is yq here.
      - uses: ./.github/actions/install-yq

      # tests/test_mcp_server.py spawns the MCP server the way its launcher
      # does — `uv run --with mcp`. Without uv on PATH those cases skip
      # themselves and the transport goes untested.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run pytest
        run: bin/local/run-tests --pytest

  surface-compat:
    name: Surface Compatibility
    runs-on: ubuntu-24.04
    # Does real work on pull_request only. On push to main the merge base with
    # origin/main is HEAD itself, so the commit range is empty and the job is a
    # no-op pass. It stays on both triggers so the check keeps reporting and any
    # required-check configuration keeps resolving after a merge.
    steps:
      # fetch-depth: 0 is required — the gate resolves a merge base against the
      # target branch, which a shallow clone cannot do.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check public surface compatibility
        run: bin/local/check-surface-compat --base origin/${{ github.base_ref || 'main' }}

  site:
    name: Site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Test remark plugins
        working-directory: site
        run: npm test

      - name: Check brand configuration
        working-directory: site
        run: npm run check

      - name: Build
        working-directory: site
        run: npm run build

      - name: Verify the brand package reached the export
        working-directory: site
        run: npm run verify
