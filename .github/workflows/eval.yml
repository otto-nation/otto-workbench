name: Eval

# Not a pull-request gate: every run spends real money on real model calls.
# It runs on a schedule and on demand, and fails when a model's token spend or
# finding quality regresses past the ratchet in ai/lib/eval/scoring.py.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated models to evaluate
        required: false
        default: sonnet
      runs:
        description: Runs per corpus case
        required: false
        default: '3'

permissions:
  contents: read

# Cron and workflow_dispatch can overlap; queue rather than cancel since these
# runs cost real money and a cancelled run's spend is not recovered.
concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    name: Corpus eval
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Costs nothing and needs no credentials: proves every manifest names a
      # task the runner can resolve before anything is spent.
      - name: Validate the corpus
        run: python3 ai/bin/eval-models --dry-run

      - name: Check for credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "No ANTHROPIC_API_KEY configured — skipping the eval run." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Claude Code CLI
        if: steps.creds.outputs.available == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "Claude Code CLI: $(claude --version)" >> "$GITHUB_STEP_SUMMARY"

      # Two model calls, a few cents, ahead of the corpus run that spends the
      # real money. Every agent below this line gets its coding rules through an
      # undocumented --bare/--add-dir coupling, and when that breaks there is no
      # error and no missing file — just agents quietly running unruled. Exit 2
      # is the canary failing to measure, which is a broken check rather than a
      # rules regression; see ai/lib/eval/rules_canary.py.
      #
      # It does not gate the corpus run. A canary that cannot measure would
      # otherwise cancel the week's eval, and the two answer different questions.
      - name: Check the rules still reach an agent
        id: canary
        if: steps.creds.outputs.available == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          rc=0
          ai/bin/rules-canary --json 2>&1 | tee canary-output.txt || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Run the eval and compare against baselines
        id: run
        if: steps.creds.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODELS: ${{ inputs.models || 'sonnet' }}
          EVAL_RUNS: ${{ inputs.runs || '3' }}
        run: |
          set -o pipefail
          rc=0
          python3 ai/bin/eval-models \
            --models "$EVAL_MODELS" --runs "$EVAL_RUNS" --compare \
            2>&1 | tee eval-output.txt || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # Every metric goes in the summary, gated and ungated alike. A gate that
      # only shows what it failed on trains people to stop reading it.
      - name: Publish the results
        if: steps.creds.outputs.available == 'true'
        run: |
          {
            echo "## Eval results"
            echo ""
            echo '```'
            cat eval-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.run.outputs.rc }}" != "0" ]]; then
            echo "::error::eval-models exited ${{ steps.run.outputs.rc }}"
            exit 1
          fi

      # Reported and gated separately from the corpus: a rules-delivery failure
      # and a model regression need different people looking at them.
      - name: Publish the canary result
        if: steps.creds.outputs.available == 'true'
        run: |
          {
            echo "## Rules canary"
            echo ""
            echo '```'
            cat canary-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.canary.outputs.rc }}" in
            0) ;;
            2)
              echo "::error::the rules canary could not measure — see ai/lib/eval/rules_canary.py"
              exit 1
              ;;
            *)
              echo "::error::--add-dir no longer loads coding rules: every agent is running unruled"
              exit 1
              ;;
          esac
