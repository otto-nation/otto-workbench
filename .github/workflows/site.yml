name: Site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  pull_request:
    paths: ["site/**"]

jobs:
  site:
    name: Site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Test remark plugins
        working-directory: site
        run: npm test

      - name: Check brand configuration
        working-directory: site
        run: npm run check

      - name: Build
        working-directory: site
        run: npm run build

      - name: Verify the brand package reached the export
        working-directory: site
        run: npm run verify
