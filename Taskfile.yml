# Workbench repo — local development tasks
# These tasks are only relevant when contributing to this repo.
#
# Global AI/git automation tasks live in Taskfile.global.yml and are
# installed to ~/.config/task/Taskfile.global.yml by install.sh.
# Run them from anywhere with: task --global commit, task --global pr:create, etc.

version: "3"

includes:
  global:
    taskfile: ./Taskfile.global.yml

tasks:
  test:
    desc: "Run bats and pytest test suites"
    silent: true
    cmds:
      - bin/local/run-tests
  test:pytest:
    desc: "Run Python (pytest) tests only"
    silent: true
    cmds:
      - bin/local/run-tests --pytest
  test:*:
    desc: "Run a single test suite by filename"
    vars:
      FILENAME: '{{index .MATCH 0}}.bats'
    silent: true
    preconditions:
      - sh: 'test -f tests/{{.FILENAME}}'
        msg: "File not found: tests/{{.FILENAME}}"
    cmds:
      - bin/local/run-tests --bats --files "tests/{{.FILENAME}}" -- --show-output-of-passing-tests

  gate:
    desc: "Run the full pre-push gate (validators, shellcheck, bats, pytest)"
    # silent only suppresses go-task's echo of the command line below — the
    # hook's own _step/_pass/_fail output still prints, same as test/lint above.
    silent: true
    cmds:
      # Delegation, not a second copy. git/hooks/pre-push-workbench owns the
      # sequence and the exit-code handling — its _run_step checks each step's
      # status rather than reading its output — and re-listing those steps here
      # would be a second definition of green that drifts from the one CI runs.
      #
      # The hook takes no arguments and reads no stdin, so a direct call is the
      # same run git makes; </dev/null is there so it cannot inherit a terminal
      # to block on. No skip flag, deliberately: a gate with a documented way to
      # skip its slow half is a gate people run with the flag. `task test`,
      # `task test:pytest` and `task lint` remain for running one part on purpose.
      - git/hooks/pre-push-workbench < /dev/null

  lint:
    desc: "Run ShellCheck on all shell scripts"
    silent: true
    cmds:
      # bash -c: go-task's shell is not bash, and lib/ui.sh only loads the
      # file helpers under bash. list_shell_scripts is the same selection the
      # pre-push hook uses — line-1 shebangs only.
      - |
        bash -c '. lib/ui.sh && list_shell_scripts . | xargs shellcheck --severity=warning'
        echo "✓ ShellCheck passed"

  wt:cleanup:
    desc: "Remove stale worktrees (merged branches, optionally age-based)"
    silent: true
    cmds:
      - wt-cleanup {{.CLI_ARGS}}

  dev:setup:
    desc: "Activate git hooks for workbench development (run once after cloning)"
    silent: true
    cmds:
      - git config --unset core.hooksPath 2>/dev/null || true
      - mkdir -p .git/hooks
      - 'printf "#!/usr/bin/env bash\nexec \"\$(git rev-parse --show-toplevel)/git/hooks/pre-commit-workbench\" \"\$@\"\n" > .git/hooks/pre-commit && chmod +x .git/hooks/pre-commit'
      - 'printf "#!/usr/bin/env bash\nexec \"\$(git rev-parse --show-toplevel)/git/hooks/pre-push-workbench\" \"\$@\"\n" > .git/hooks/pre-push && chmod +x .git/hooks/pre-push'
      - 'echo "✓ Git hooks activated (pre-commit: auto-regenerate, pre-push: lint + test)"'
