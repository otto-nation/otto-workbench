# Source of truth for what claude-bash-guard blocks and why.
#
# Each rule's `why` and `remedy` render into two places, so they are written
# once here:
#   claude-bash-guard              — the BLOCKED message Claude sees at run time
#   ai/guidelines/rules/<doc>      — the lead bullet of the matching section
#
# Regenerate both: bin/local/generate-bash-guard
#
# Fields:
#   id       identifier; matches the <!-- rule:<id> --> marker in the doc and
#            the GUARD_MSG_<id> variable in the guard
#   title    the `## ` heading the rule is documented under
#   doc      rules file holding that heading, relative to ai/guidelines/rules/
#   never    the banned form, completing "Never {never} — ..."
#   why      lowercase clause explaining the prompt; rendered sentence-initial
#            in the guard message, so word it to read well capitalized
#   remedy   capitalized sentence naming the alternative
#   scope_example
#            for statement-anchored rules: an example showing the pattern still
#            counts after a separator. Renders the shared "applies wherever a
#            statement begins" sentence, which was copy-pasted per section
#   list     true when hand-written sub-bullets follow the generated lead bullet
#   guard    false for doc-only rules the guard cannot match mechanically
#   guard_remedy
#            overrides `remedy` in the guard message only. Two reasons to set
#            it: the message names the offending token back to Claude, where
#            `{match}` is substituted with the captured text at run time and a
#            doc bullet has nothing to substitute; or the doc bullet is followed
#            by sub-bullets that already spell the alternatives out, so the
#            generic "Use these alternatives instead" reads better there than
#            the explicit list a one-shot terminal message needs

rules:
  - id: gh_pr_create
    title: "PR Creation"
    doc: git-operations.md
    why: "the repo PR template is skipped when gh pr create is called directly"
    remedy: "Use task pr:create instead"

  - id: bin_local
    title: "Script Invocation"
    doc: bash.md
    why: "permission rules match the first word of the command, so an absolute path prompts again in every worktree"
    remedy: "Use the path relative to the repo root"
    guard_remedy: "Use relative path '{match}' instead"

  - id: cmd_substitution
    title: "Avoid Command Substitution in Arguments"
    doc: bash-tool.md
    never: "use `$(...)` command substitution inside Bash tool commands"
    why: "Claude Code's static analyzer cannot resolve the substitution, triggering a \"cannot be statically analyzed\" permission prompt"
    remedy: "Run the inner command first, then use the result in the next call"
    list: true

  - id: compound_cd
    title: "Avoid Compound `cd` Commands"
    doc: bash-tool.md
    never: "use `cd <path> && <command>`"
    why: "compound commands containing `cd` trigger an unsuppressible security prompt in Claude Code"
    scope_example: "mkdir -p x; cd x && ls"
    remedy: "Use these alternatives instead"
    list: true

  - id: env_chdir
    title: "Avoid `env -C`"
    doc: bash-tool.md
    never: "run a command through `env -C <dir> ...` (or `env --chdir=<dir> ...`)"
    why: "the analyzer reports \"env with -C flag cannot be statically analyzed\", which no permission rule can suppress; `env -C` is not an escape hatch from the compound-`cd` rule, it is a second unsuppressible prompt"
    remedy: "Use a bare `cd <dir>` first, per § Avoid Compound `cd` Commands"

  - id: func_def
    title: "Avoid Shell Function Definitions"
    doc: bash-tool.md
    never: "define a shell function in a Bash tool command"
    why: "both `name() { ...; }` and `function name { ...; }` make the parser classify the whole command as too complex to analyze (\"Contains function_definition\"), which skips the allow list entirely so no permission rule can match it"
    remedy: "Write the command directly with absolute paths"
    list: true

  - id: sysbin
    title: "Avoid Absolute Paths to System Binaries"
    doc: bash-tool.md
    never: "invoke a system binary by its absolute path (`/bin/cat`, `/usr/bin/grep`, `/usr/bin/env`)"
    why: "the permission allow list keys on the bare command name (`Bash(cat:*)`), so the `/bin` and `/usr/bin` forms never match it and prompt every time"
    scope_example: "ls; /bin/cat file"
    remedy: "Call the bare name instead — it resolves through `PATH` to the same binary"
    guard_remedy: "Use '{match}' instead of its absolute path"
    list: true

  - id: env_var_prefix
    title: "Avoid Env-Var Prefix Syntax"
    doc: bash-tool.md
    never: "prefix a command with `VAR=value command`"
    why: "Claude Code's permission matcher sees `VAR=value` as the command name, triggering a prompt every time"
    scope_example: "true; W=/tmp x"
    remedy: "Use tool-native alternatives"
    guard_remedy: "Use tool-native flags instead (task --global REPO_DIR=..., mise -C ..., go env -w ...)"
    list: true

  - id: brace_expansion
    title: "Avoid Brace Expansion"
    doc: bash-tool.md
    never: "use `{a,b,c}` brace expansion in Bash commands"
    why: "Claude Code flags it with an unsuppressible \"Brace expansion\" permission prompt"
    remedy: "Use these alternatives instead"
    guard_remedy: "List files individually or use a glob (*.go) instead"
    list: true

  - id: var_expansion
    title: "Avoid Shell Variable Expansion"
    doc: bash-tool.md
    guard: false
    never: "use `echo \"$VAR\"` or `$VAR` in Bash tool commands"
    why: "Claude Code's static analyzer flags shell variable references as \"simple_expansion\", triggering a permission prompt"
    remedy: "Use `printenv VAR` instead, which reads the variable without shell expansion"
    list: true

  - id: find_exec
    title: "Avoid `find -exec`"
    doc: bash-tool.md
    never: "use `find ... -exec`"
    why: "Claude Code blocks `-exec` even with `Bash(find:*)` allowed because `-exec` can run arbitrary commands"
    remedy: "Use piped alternatives instead"
    guard_remedy: "Use find ... -print0 | xargs -0 <command> instead"
    list: true
