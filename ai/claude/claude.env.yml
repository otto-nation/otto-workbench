# AI model routing — the SSOT for which models every harness uses.
#
# Generic AI_* names in ~/.env.local are the single place to change model
# versions.  Each harness sync maps them to its own format:
#   Claude Code: `target` names are written into ~/.claude/settings.json env block
#   Pi:          read at sync time and written into ~/.pi/agent/settings.json
#
# Regenerate: generate-tool-context

meta:
  section: "AI model routing"
  install_check: true
  install_check_command: claude
  validation: none
  claude_env: true

env:
  - var: AI_MODEL
    target: ANTHROPIC_MODEL
    comment: "Default model for AI coding sessions, e.g. claude-opus-5"
  - var: AI_OPUS_MODEL
    target: ANTHROPIC_DEFAULT_OPUS_MODEL
    comment: "Model the Opus tier alias resolves to"
  - var: AI_SONNET_MODEL
    target: ANTHROPIC_DEFAULT_SONNET_MODEL
    comment: "Model the Sonnet tier alias resolves to"
  - var: AI_HAIKU_MODEL
    target: ANTHROPIC_DEFAULT_HAIKU_MODEL
    comment: "Model the Haiku tier alias resolves to — also the background/summarisation model"

tools: []
