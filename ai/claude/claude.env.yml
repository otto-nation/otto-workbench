# Claude Code model routing — read by the Claude Code CLI itself, and mirrored
# into ~/.claude/settings.json by step_claude_settings so a session launched
# outside an interactive shell routes the same way.
# Regenerate: generate-tool-context

meta:
  section: "Claude Code (model routing)"
  install_check: true
  install_check_command: claude
  validation: none
  claude_env: true

env:
  - var: ANTHROPIC_MODEL
    comment: "Model the main session runs on, e.g. claude-opus-5"
  - var: ANTHROPIC_DEFAULT_OPUS_MODEL
    comment: "Model the Opus alias resolves to"
  - var: ANTHROPIC_DEFAULT_SONNET_MODEL
    comment: "Model the Sonnet alias resolves to"
  - var: ANTHROPIC_DEFAULT_HAIKU_MODEL
    comment: "Model the Haiku alias resolves to — also the background/summarisation model"

tools: []
