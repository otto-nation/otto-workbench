# Claude Code script registry — installed only when the Claude sub-tool is
# selected. Everything here is a Claude Code construct: a hook wired from
# settings.json, the statusLine command, or a runner for Claude's own CLI.
# The harness-neutral CLIs live in ai/registry.yml.
# Regenerate: generate-tool-context

meta:
  section: "AI Tooling"
  validation: bindir
  source: ai/claude/bin

tools:
  - name: claude-bash-guard
    permission: false
    visibility: hidden
    description: "PreToolUse hook for the Bash tool — blocks command shapes that trigger unsuppressible permission prompts"

  - name: reuse-mode-tracker
    permission: false
    visibility: hidden
    description: "Track /reuse lite|full|ultra commands via UserPromptSubmit hook"

  - name: reuse-session-start
    permission: false
    visibility: hidden
    description: "SessionStart hook — inject reuse level and ceiling scan nudge"

  - name: reuse-subagent-start
    permission: false
    visibility: hidden
    description: "SubagentStart hook — inject reuse level into spawned subagents"

  - name: workbench-statusline
    permission: false
    visibility: hidden
    description: "Status line script — displays reuse level, ceiling debt count, and review status"

  - name: run-auto-task
    permission: false
    visibility: hidden
    description: "Run a Claude Code skill as a headless background session with output logging"
