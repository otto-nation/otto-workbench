# herdr-app window launchers. A second registry because ai/herdr/registry.yml
# is `validation: none` (the herdr TUI is not a bindir script). Discoverable as
# */*/registry.yml; source is ai/herdr/bin.
# Regenerate: generate-tool-context

meta:
  section: "AI Tooling"
  validation: bindir
  source: ai/herdr/bin

tools:
  - name: herdr-app
    permission: false
    visibility: brief
    description: "Open the main Herdr window detached from the terminal (no-op when running), or run a Herdr command. Operator tool"
  - name: herdr-app-untrusted
    permission: false
    visibility: brief
    description: "Launch an isolated Herdr window (HC_SESSION=untrusted) with no local terminals. Operator tool"
