# otto-nation theme for herdr-app.
#
# @otto-nation/brand owns every value here: hexes come from src/tokens.css and
# the terminal colors (background, foreground, selection, cursor, the 16 ANSI
# slots) from terminal/otto-{light,dark}.json, both in the package pinned by
# site/package.json. A brand:<token> name is the CSS custom property without its
# leading --. [schemes] picks :root (light) or :root overlaid with .dark, and the
# matching terminal file. No literal hex belongs in this file.
#
# Roles follow the brand's DESIGN.md: hover and selected are their own fills, so
# a hairline border stays visible on a hovered surface; the focus ring is anil;
# dim text is ink-muted, because outline is a 3:1 non-text colour; working is
# info and blocked is warn; depth comes from an edge, not a raised fill. Edit
# this file and regenerate with bin/local/generate-herdr-app-themes; never edit
# the JSON.

[palette]
canvas = "brand:ow-canvas"
surface = "brand:ow-surface"
ink = "brand:ow-ink"
ink_muted = "brand:ow-ink-muted"
hairline = "brand:ow-hairline"
outline = "brand:ow-outline"
hover = "brand:ow-hover"
selected = "brand:ow-selected"
anil = "brand:ow-anil"
info = "brand:ow-info"
done = "brand:ow-done"
warn = "brand:ow-warn"
amarillo = "brand:ow-amarillo"
rosa = "brand:ow-rosa"
on_amarillo = "brand:ow-on-amarillo"
on_rosa = "brand:ow-on-rosa"

[schemes]
otto-light = "light"
otto-dark = "dark"

[themes.otto-light]
terminal = "brand"

[themes.otto-light.colors]
canvas = "canvas"
chrome = "canvas"
surface = "surface"
popover = "surface"
raised = "surface"
hover = "hover"
selected = "selected"
border = "hairline"
input = "outline"
foreground = "ink"
muted = "ink_muted"
dim = "ink_muted"
accent = "rosa"
accent_foreground = "on_rosa"
solid = "ink"
solid_foreground = "canvas"
ring = "anil"
working = "info"
blocked = "warn"
done = "done"
idle = "ink_muted"
unknown = "ink_muted"

[themes.otto-dark]
terminal = "brand"

[themes.otto-dark.colors]
canvas = "canvas"
chrome = "canvas"
surface = "surface"
popover = "surface"
raised = "surface"
hover = "hover"
selected = "selected"
border = "hairline"
input = "outline"
foreground = "ink"
muted = "ink_muted"
dim = "ink_muted"
accent = "amarillo"
accent_foreground = "on_amarillo"
solid = "ink"
solid_foreground = "canvas"
ring = "anil"
working = "info"
blocked = "warn"
done = "done"
idle = "ink_muted"
unknown = "ink_muted"
