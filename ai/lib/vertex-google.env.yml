# Vertex AI location for Google's own models — read by Pi's built-in
# google-vertex provider, and by any Google SDK that resolves a location itself.
# Regenerate: generate-tool-context
#
# Separate from vertex.env.yml, which carries `claude_env: true`, because this
# variable must not enter Claude Code's settings.json. Two reasons, and either
# alone is enough:
#
#   Claude Code has no use for it — it reads CLOUD_ML_REGION — so mirroring it
#   would publish a variable to a world-readable file for no reader.
#
#   settings.json wins over the process environment in Claude Code, and the
#   mirror is keyed on target names. A value that landed there could not be
#   overridden from a shell afterwards, which is precisely the divergence this
#   file exists to permit: Anthropic models provisioned in a region while
#   Gemini is served from the global endpoint.
#
# No `default:` on purpose. A var with one is emitted as an active export by
# zsh/steps.sh (_env_entry_plain), which would export a location on every
# machine that has gcloud installed, Vertex user or not. It stays a commented
# reference until an operator sets it.

meta:
  section: "Vertex AI (Google models)"
  install_check: true
  install_check_command: gcloud
  validation: none

env:
  - var: GOOGLE_CLOUD_LOCATION
    comment: "Vertex location serving Google's own models, e.g. global — without it Pi's google-vertex provider declines to register"

tools: []
