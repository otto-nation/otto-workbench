# Vertex AI — one deployment, read by ai/lib/agent/vertex_quota.py (through
# ai_backend.preflight()), the Claude Code CLI, Pi's built-in google-vertex
# provider, gcloud and the Google SDKs. Regenerate: generate-tool-context
#
# Each fact is declared once, under the name Google's own tooling reads, and
# reaches a consumer that spells it differently through `target:`. The project id
# is GOOGLE_CLOUD_PROJECT here and arrives at Claude Code as
# ANTHROPIC_VERTEX_PROJECT_ID; gcloud, the SDKs and Pi read the neutral name, so
# that is the one ~/.env.local carries.
#
# The two regions are not one fact under two names and are deliberately not
# mapped to each other. CLOUD_ML_REGION is where the Anthropic models are
# provisioned, which is what quota is scoped to; GOOGLE_CLOUD_LOCATION is where
# Google's own models are served. They are equal on a machine using the global
# endpoint for both, and must be free to differ on one that is not — a `target:`
# would foreclose that, since it is one variable under two names.

meta:
  section: "Vertex AI"
  install_check: true
  install_check_command: gcloud
  validation: none
  claude_env: true

env:
  - var: CLAUDE_CODE_USE_VERTEX
    comment: "Route the Claude Code CLI through Vertex AI and enable the review quota preflight"
  - var: GOOGLE_CLOUD_PROJECT
    target: ANTHROPIC_VERTEX_PROJECT_ID
    comment: "GCP project serving the models — read by gcloud, the Google SDKs and Pi; Claude Code receives it as ANTHROPIC_VERTEX_PROJECT_ID"
  - var: CLOUD_ML_REGION
    comment: "Vertex region serving the Anthropic models, e.g. us-east5 ('global' for the global endpoint)"
  # Held back from ~/.claude/settings.json, for either of two reasons alone:
  # Claude Code reads CLOUD_ML_REGION and has no use for this one, so mirroring
  # it would publish a variable to a world-readable file for no reader. And
  # settings.json wins over the process environment there, so a value that
  # landed in it could not be overridden from a shell afterwards — which is
  # precisely the divergence this variable exists to permit.
  - var: GOOGLE_CLOUD_LOCATION
    claude_env: false
    comment: "Vertex location serving Google's own models, e.g. global — without it Pi's google-vertex provider declines to register"

tools: []
