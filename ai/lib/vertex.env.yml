# Vertex AI routing for the Claude backend — consumed by ai/lib/agent/vertex_quota.py,
# reached through ai_backend.preflight(). Regenerate: generate-tool-context
#
# The project id is declared here under the name Google's own tooling reads,
# GOOGLE_CLOUD_PROJECT, and reaches Claude Code as ANTHROPIC_VERTEX_PROJECT_ID
# through the `target:` mapping. One GCP project, several consumers, each with
# its own spelling: gcloud, the Google SDKs and Pi's built-in google-vertex
# provider all read the neutral name, so that is the one ~/.env.local carries.
#
# The region is not the same kind of value and is deliberately not mapped.
# CLOUD_ML_REGION is where the Anthropic models are provisioned, which is a
# per-deployment fact quota is scoped to; GOOGLE_CLOUD_LOCATION is where Google's
# own models are served. They are equal on a machine using the global endpoint
# for both and must be free to differ on one that is not — see
# ai/lib/vertex-google.env.yml, which declares the Google-side name separately
# for exactly that reason.

meta:
  section: "Vertex AI (Claude backend)"
  install_check: true
  install_check_command: gcloud
  validation: none
  claude_env: true

env:
  - var: CLAUDE_CODE_USE_VERTEX
    comment: "Route the Claude Code CLI through Vertex AI and enable the review quota preflight"
  - var: GOOGLE_CLOUD_PROJECT
    target: ANTHROPIC_VERTEX_PROJECT_ID
    comment: "GCP project serving the models — read by gcloud, the Google SDKs and Pi; Claude Code receives it as ANTHROPIC_VERTEX_PROJECT_ID"
  - var: CLOUD_ML_REGION
    comment: "Vertex region serving the Anthropic models, e.g. us-east5 ('global' for the global endpoint)"

tools: []
