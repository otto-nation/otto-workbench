# Vertex AI routing for the Claude backend — consumed by ai/lib/vertex_quota.py,
# reached through ai_backend.preflight(). Regenerate: generate-tool-context

meta:
  section: "Vertex AI (Claude backend)"
  install_check: true
  install_check_command: gcloud
  validation: none
  claude_env: true

env:
  - var: CLAUDE_CODE_USE_VERTEX
    comment: "Route the Claude Code CLI through Vertex AI and enable the review quota preflight"
  - var: ANTHROPIC_VERTEX_PROJECT_ID
    comment: "GCP project whose Vertex model quota is inspected"
  - var: CLOUD_ML_REGION
    comment: "Vertex region serving the models, e.g. us-east5 ('global' for the global endpoint)"

tools: []
