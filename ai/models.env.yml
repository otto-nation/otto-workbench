# AI model routing — the SSOT for which models every harness uses.
#
# Generic AI_* names in ~/.env.local are the single place to change model
# versions.  Each harness sync derives its own format from the `role` fields
# below, so adding a tier is an edit to this file and nothing else:
#   Claude Code: `target` names are written into ~/.claude/settings.json env block
#   Pi:          read at sync time into defaultModel + enabledModels in
#                ~/.pi/agent/settings.json
#
# Harness-neutral, so it sits under ai/ rather than in either harness's
# directory. A machine running one harness still needs the catalogue, which is
# why there is no install check here — gating on `claude` would leave a Pi-only
# machine with no model lines in ~/.env.local and no prompt to add them.
#
# Regenerate: generate-tool-context

meta:
  section: "AI model routing"
  validation: none
  claude_env: true

env:
  - var: AI_MODEL
    role: model-default
    target: ANTHROPIC_MODEL
    comment: "Default model for AI coding sessions, e.g. claude-opus-5"
  - var: AI_OPUS_MODEL
    role: model-tier
    target: ANTHROPIC_DEFAULT_OPUS_MODEL
    comment: "Model the Opus tier alias resolves to"
  - var: AI_SONNET_MODEL
    role: model-tier
    target: ANTHROPIC_DEFAULT_SONNET_MODEL
    comment: "Model the Sonnet tier alias resolves to"
  - var: AI_HAIKU_MODEL
    role: model-tier
    target: ANTHROPIC_DEFAULT_HAIKU_MODEL
    comment: "Model the Haiku tier alias resolves to — also the background/summarisation model"

tools: []
