# Profile definitions for workbench config exports.
# Components not listed under exclude are included by default.
# The dev profile (local workstations) includes everything — it's implicit.

profiles:
  server:
    exclude:
      skills:
        - dream
        - promote
        - machine
        # Agent-backed: its body is an unresolved AGENT_PROTOCOL_PLACEHOLDER
        # until ai/skills/steps.sh splices the protocol in at install time, and
        # the export copies the source tree verbatim. Claude Code reads the same
        # protocol from agents/reviewer.md, which the export already carries.
        - reviewer
