# Harness-neutral AI script registry — installed whenever the AI subsystem is
# set up, whichever harnesses the operator selected.
# Regenerate: generate-tool-context

meta:
  section: "AI Tooling"
  validation: bindir
  source: ai/bin

tools:
  - name: record-filed-issue
    permission: false
    visibility: hidden
    description: "Records an issue filed by hand in the branch's follow-up ledger — called by both harnesses' post-execution hooks"

  - name: pr
    parser: cli.pr:reference_shape
    permission: true
    visibility: full
    description: "Unified PR lifecycle CLI — creation, CI failures, code review, and review comments"
    when_to_use: "Managing PR lifecycle: opening a PR, checking CI status, running reviews, addressing comments, or viewing unified PR status. Across all my open PRs at once (rebase, fix CI, comments, self-review): `pr batch run --checkout DIR --steps rebase,ci` — it plans for itself, runs each step only where needed, and pushes nothing until its publish decisions are resolved; see `pr batch run --help`"

  - name: review
    parser: cli.review_entry:build_parser
    permission: true
    visibility: full
    description: "Run the configured review agent on a PR with local worktree checkout and iterative review support"
    when_to_use: "Running a structured code review on a PR; supports re-reviews that track resolved vs open findings. Use --self for self-review before PR creation. Use --recover to finish a review whose agents failed — it completes at the commit the run started from, even if the branch has new commits (so it cannot be combined with --fix once HEAD has moved). For multiple PRs, dispatch separate subagents — do not background with &"

  - name: otto-log
    parser: cli.otto_log:build_parser
    permission: true
    visibility: full
    description: "Query the unified trail root and AI usage across otto-workbench scripts — audit trail plus cost and token stats"
    when_to_use: "Tracing what an AI script did (recent, query, show, list), seeing what AI calls cost across scripts, tasks, models, and days (stats), or reclaiming the trail root ahead of its retention horizon (prune). One user command spans several processes; show takes any of their invocation IDs and renders the whole command"

  - name: workbench-rules
    permission: true
    visibility: brief
    description: "Manages this machine's own coding-rule layers — local additions and overrides, for whichever harnesses are installed"

  - name: ceiling-scan
    parser: ai/bin/ceiling-scan:build_parser
    permission: true
    visibility: brief
    description: "Scan for ceiling: and ceiling-permanent: markers and produce a structured debt ledger"

  - name: dream-scan
    parser: cli.dream_scan:build_parser
    permission: true
    visibility: brief
    description: "Scan session transcripts and memory state for dream consolidation"

  - name: dream-verify
    permission: true
    visibility: brief
    description: "Verify dream memory file integrity across all projects"

  - name: promote-scan
    parser: cli.promote_scan:build_parser
    permission: true
    visibility: brief
    description: "Scan memories and workbench artifacts for promotion evaluation"

  - name: retro-scan
    parser: cli.retro_scan:build_parser
    permission: true
    visibility: brief
    description: "Scan PR review comments and cross-reference against coding rules"

  - name: retro-consume
    parser: cli.retro_consume:build_parser
    permission: true
    visibility: brief
    description: "Delete the local reviews a retro consumed, for the scan ID that recorded them"

  - name: wiki
    parser: cli.wiki:build_parser
    permission: true
    visibility: brief
    description: "Mechanical operations over a compiled knowledge base — status, lint, signals, archive, source hashes, index, browsing link, snapshots"

  - name: workbench-reference
    permission: true
    visibility: brief
    description: "Reference card — lists all workbench skills, agents, and reuse modes"

  - name: ci-check
    permission: true
    visibility: hidden
    description: "Fetch CI run data, classify failures, and output status dashboard"

  - name: pr-rebase
    permission: false
    visibility: hidden
    description: "Rebase current branch onto its base with conflict detection and force-push"

  - name: pr-describe
    permission: false
    visibility: hidden
    description: "Revise the PR description against the repo's PR template once the branch stops moving"

  - name: review-orchestrate
    permission: false
    visibility: hidden
    description: "Review orchestration engine for review — manages tier classification, file grouping, and review merging"

  - name: review-post
    permission: false
    visibility: hidden
    description: "Deterministic posting of review findings to GitHub as a PENDING PR review"

  - name: review-rebuild
    permission: false
    visibility: hidden
    description: "Rebuild review.md from group finding files — recovers from synthesis formatting drift"

  - name: review-threads
    permission: false
    visibility: hidden
    description: "Thread lifecycle status for PR review comments — dashboard and JSON report"

  - name: validate-review-positions
    permission: false
    visibility: hidden
    description: "Validates review finding positions against a PR diff to ensure comment placement accuracy"

  - name: ai-usage-log
    permission: false
    visibility: hidden
    description: "Bridge shell-invoked AI calls into the global usage ledger — render, unwrap, record"

  - name: eval-models
    parser: cli.eval_models:build_parser
    permission: false
    visibility: hidden
    description: "Evaluation runner — scores AI calls against a corpus, one task per manifest"

  - name: rules-canary
    parser: cli.rules_canary:build_parser
    permission: false
    visibility: hidden
    description: "Canary for the --add-dir coupling — fails when coding rules stop reaching an agent"

  - name: otto-mcp-server
    permission: false
    visibility: hidden
    reference: true
    description: "MCP server — offers the tools the component registries declare, with schemas imported in-process"

  - name: build-otto-ai-tools-tarball
    permission: false
    visibility: hidden
    description: "Package otto-ai-tools into a self-contained tarball for distribution"

  - name: build-claude-config-tarball
    permission: false
    visibility: hidden
    description: "Package Claude Code configuration into a tarball for server or container deployment"

  - name: workbench-export
    permission: false
    visibility: hidden
    description: "Export workbench Claude configs as a self-contained tarball, filtered by profile"
