# Workbench-internal script registry — scripts run from the repo root, not installed globally.
# These are only useful within the otto-workbench repo itself.
# Regenerate: bin/local/generate-tool-context

meta:
  section: "Workbench Dev Scripts"
  scope: workbench
  validation: bindir
  source: bin/local

tools:
  - name: run-tests
    permission: false
    visibility: brief
    description: "Runs the bats and pytest suites with the repo's parallelism settings — the single entry point used by the Taskfile, the pre-push hook, and CI"

  - name: validate-all
    permission: false
    visibility: brief
    description: "Runs every validator discovered in bin/ and bin/local/ — the single entry point used by the pre-push hook and CI"

  - name: validate-registries
    permission: false
    visibility: brief
    description: "Validates all tool registry YAML files for schema correctness and cross-file consistency"

  - name: validate-components
    permission: false
    visibility: brief
    description: "Validates all component framework contracts — Tier 1 sync_<name>() presence, Tier 2 registry consistency"

  - name: validate-migrations
    permission: false
    visibility: brief
    description: "Validates migration file naming, function naming, and shebang conventions"

  - name: validate-errexit
    permission: false
    visibility: brief
    description: "Validates bash scripts for dangerous && patterns that silently exit under set -e"

  - name: validate-skills
    permission: false
    visibility: brief
    description: "Validates SKILL.md frontmatter conventions — required fields, name/directory consistency, lifecycle field pairing, agent-to-skill coverage"

  - name: validate-cli-flags
    permission: false
    visibility: brief
    description: "Validates CLI flag conventions — no --repo alias, --pr/--branch mutual exclusivity"

  - name: validate-worktree-guards
    permission: false
    visibility: brief
    description: "Validates that ctx.worktree_root is never dereferenced without a guard or require_worktree()"

  - name: validate-timeouts
    permission: false
    visibility: brief
    description: "Validates that every subprocess timeout comes from the ai/lib/core/timeouts.py tiers"

  - name: validate-magic-values
    permission: false
    visibility: brief
    description: "Validates that an abbreviated sha, an exit code, and a truncation cap are spelled by the module that owns them"

  - name: validate-frozen-roots
    permission: false
    visibility: brief
    description: "Validates that no module freezes a workbench root into an import-time constant"

  - name: validate-stat-portability
    permission: false
    visibility: brief
    description: "Validates that stat format flags are confined to the lib/portable.sh helpers"

  - name: validate-script-loading
    permission: false
    visibility: brief
    description: "Validates that only tests/conftest.py executes a module out of a file, so one script never has two module objects"

  - name: validate-permissions
    permission: false
    visibility: brief
    description: "Validates that every Bash permission rule can match a command, that no untracked settings file duplicates a tracked grant or re-grants a gated one, and that a tracked allow bucket is in the codepoint order both ai sync and Claude Code write it back in — --fix prunes the duplicates and sorts the bucket"

  - name: validate-ceiling
    permission: false
    visibility: brief
    description: "Validates that every ceiling marker names an upgrade trigger or is marked permanent"

  - name: validate-tool-schema
    permission: false
    visibility: brief
    description: "Validates that every script claiming the --tool-schema protocol can answer the MCP server's probe"

  - name: validate-eval-baselines
    permission: false
    visibility: brief
    description: "Validates eval baseline files for schema correctness and corpus coverage"

  - name: validate-docs-composed
    permission: false
    visibility: brief
    description: "Validates that every composed doc matches what its docs/*.src.md composes to"

  - name: validate-doc-reference
    permission: false
    visibility: brief
    description: "Validates that a source doc renders every module group its source set declares"

  - name: validate-doc-budget
    permission: false
    visibility: brief
    description: "Validates that a doc declaring a line budget stays within it and holds no '####' heading"

  - name: validate-tracked-ignored
    permission: false
    visibility: brief
    description: "Validates that no tracked file lives under a path .gitignore claims to ignore"

  - name: validate-rules
    permission: false
    visibility: brief
    description: "Validates rule frontmatter conventions — harness scoping resolves, no Claude-only tool vocabulary in a rule that reaches Pi"

  - name: compose-docs
    permission: false
    visibility: brief
    description: "Composes docs/*.md from docs/*.src.md by expanding include directives into generator output"

  - name: generate-doc-reference
    permission: false
    visibility: brief
    description: "Renders a module reference from the doc blocks of a source set's own modules"

  - name: generate-tool-context
    permission: false
    visibility: brief
    description: "Generates tools.generated*.md rule files from the domain registries"

  - name: generate-config-schema
    permission: false
    visibility: brief
    description: "Generates config.schema.json and the docs key reference from WorkbenchConfig"

  - name: generate-public-surface
    permission: false
    visibility: brief
    description: "Generates the per-package public surface snapshot from the registries, config schema, and shipped artifacts"

  - name: validate-public-surface
    permission: false
    visibility: brief
    description: "Validates that the committed public surface snapshots match the registries, config schema, and shipped artifacts they are generated from"

  - name: check-surface-compat
    permission: false
    visibility: brief
    description: "Fails when a public surface entry is removed without a breaking-change or Not-Breaking declaration"
