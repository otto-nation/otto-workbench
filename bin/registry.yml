# Bin script registry — globally installed scripts available from any directory.
# Regenerate: bin/local/generate-tool-context

meta:
  section: "Workbench Scripts"
  validation: bindir
  source: bin

tools:
  - name: task
    permission: true
    visibility: full
    description: "AI-powered Git automation runner; wraps go-task with global/local Taskfile routing"
    when_to_use: "Running any dev workflow — commits, PRs, brew management"
    usage: "task commit  |  task pr:create  |  task --global <cmd>"
    docs: "https://taskfile.dev"

  - name: otto-workbench
    permission: true
    visibility: full
    description: "Manage your workbench developer environment"
    when_to_use: "After pulling workbench updates or when config gets out of sync"
    usage: "otto-workbench sync  |  otto-workbench ai init  |  otto-workbench ai sync  |  otto-workbench projects  |  otto-workbench changelog"
    commands:
      - name: "install [--all] [COMPONENT ...]"
        description: "Bootstrap the workbench on a new machine (first-time setup)"
        scope: "All components"
        when: "Setting up a machine for the first time, or adding a component that was skipped"
        detail: "Installs Homebrew if missing, syncs core config, then offers the optional component menu. `--all` skips the menu and installs everything; naming components installs just those."
      - name: sync
        description: "Re-apply all workbench config — migrations, symlinks, tool context, AI settings"
        scope: "All components"
        when: "After pulling workbench updates or when config drifts"
        detail: "Re-applies all workbench config — runs pending migrations, re-symlinks scripts and configs, regenerates tool context, and syncs AI settings. Safe to re-run at any time."
      - name: discover
        description: "Show installed components, available scripts, and agent status"
        scope: "Environment overview"
        when: "Checking what's installed, available scripts, and running agents"
        detail: "Shows installed components, available bin scripts (from registry), and launchd agent status."
      - name: "discover regenerate"
        description: "Re-detect installed components after manual changes"
        scope: "Component state"
        when: "Re-detecting installed components after manual changes"
      - name: "ai init"
        description: "Scaffold .claude/ in the current repo with stack-detected rules"
        scope: "Project"
        when: "Setting up Claude in a new project repo"
        detail: "Scaffolds a `.claude/` directory in the current git repo with stack-detected rules and a project anatomy file."
      - name: "ai init --force"
        description: "Re-scaffold an existing project's .claude/ directory"
        scope: "Project"
        when: "Re-scaffolding an existing project's `.claude/`"
      - name: "ai sync"
        description: "Sync machine-level AI config (settings, rules, skills, agents, MCPs)"
        scope: "Machine"
        when: "Syncing just AI config without a full workbench sync"
        detail: "Syncs machine-level AI config (settings, rules, skills, agents, MCPs). AI-only subset of 'otto-workbench sync'."
      - name: "ai override"
        description: "Manage user overrides for AI agents, skills, and rules"
        scope: "Machine"
        when: "Customizing AI agents, skills, or rules without editing tracked files"
        detail: "Manage user overrides — add, disable, enable, list, and show status of overrides for agents, skills, and rules."
      - name: changelog
        description: "Show recent changes from conventional commits"
        scope: "Git history"
        when: "Reviewing recent changes from conventional commits"
      - name: projects
        description: "List the repos on this machine that use the workbench"
        scope: "Machine"
        when: "Checking which repos the machine profile and project migrations will visit"
        detail: "Lists the project registry. A repo joins it the first time a workbench command runs in it — nothing is discovered by scanning directories."
      - name: "projects add [DIR]"
        description: "Register a repo that hasn't run a workbench command yet"
        scope: "Machine"
        when: "Backfilling a repo into the registry ahead of its first workbench command"
      - name: "projects forget DIR"
        description: "Drop a repo's entry from the registry"
        scope: "Machine"
        when: "Removing a repo that should no longer be visited"
      - name: "projects prune"
        description: "Drop registry entries whose directory is gone"
        scope: "Machine"
        when: "Cleaning up entries left behind by deleted repos"
      - name: "permissions sweep"
        description: "Report Claude Code permission-grant drift in every registered repo"
        scope: "Machine"
        when: "Checking what has accumulated in settings.local.json and in bare-repo containers"
        detail: "Reports three classes per untracked settings file — a grant re-granting an ask-gated command, a grant another rule already makes, and a grant naming a directory that is gone. Reports only; exits 0 whether or not it finds drift."
      - name: "permissions sweep --prune"
        description: "Delete the local grants another rule already makes"
        scope: "Machine"
        when: "Clearing the dead-weight class after reading the report"
        detail: "Deletes only grants a tracked or machine-wide rule already makes, which is a no-op on effective permissions. Ask-overrides and stale paths are never touched."
      - name: "permissions mirror"
        description: "Copy a repo's tracked grants into the bare-repo container above its worktrees"
        scope: "Machine"
        when: "A repo's own scripts keep prompting in a session launched from the container"
        detail: "Claude Code roots a project at the launch directory, and a bare-repo container holds no working tree, so a repo's tracked .claude/settings.json never loads there. This copies its allow and ask rules into a generated .claude/settings.json at the container, stamped so a later run can replace them without touching grants added by hand. Idempotent, and run by `otto-workbench ai sync`."
      - name: "config set KEY VALUE"
        description: "Write one key into the machine-wide config, checked against the key surface"
        scope: "Machine"
        when: "Recording a setting — an issue tracker, a reuse level — rather than hand-editing config.yml"
        detail: "Refuses a key neither this checkout nor the installed workbench reads, so a stale worktree cannot silently record a name the config moved off. The config file is shared by every repo on the machine and an unknown key is dropped on read, which is why the refusal happens at write time."
      - name: "config set KEY VALUE --project"
        description: "Write one key into the current repo's .workbench.yml instead"
        scope: "Project"
        when: "The answer belongs to this repo and should be committed with it"
        detail: "Same key check. The file is committed, so a key nothing reads travels to everyone who clones."
      - name: "config status"
        description: "Show every scope, every resolved value, and the file each came from"
        scope: "Project"
        when: "A setting is not taking effect, or you need to know which file to edit"
        detail: "The loader deep-merges every scope and returns only the result, so a value inherited from the machine-wide file looks identical to one this repo set, and a key written under a name nothing reads looks identical to a key nobody ever set. This prints the scopes in precedence order with their paths, each key with the file that supplied it, and any key a file holds that the config surface does not have."

  - name: mem-analyze
    permission: true
    visibility: brief
    description: "macOS memory analysis report — pressure, swap usage, top processes, per-user totals"

  - name: wt-cleanup
    permission: true
    visibility: brief
    description: "Remove stale git worktrees — merged branches and optionally age-based cleanup"

  - name: resolve-branch
    permission: true
    visibility: brief
    description: "Resolve a fuzzy branch name to an exact git branch — tries exact, worktree, separator, fuzzy"

  - name: resolve-worktree
    permission: true
    visibility: brief
    description: "Print the worktree a bare-repo container stands in for — the checkout of its default branch"

  - name: wt-init
    permission: true
    visibility: brief
    description: "Convert a regular git repo to a bare repo with worktrees"

  - name: lint-sweep
    permission: true
    visibility: brief
    description: "Sweep lint violations across multiple Go repos — detect, report, and optionally create fix branches"

  - name: validate-nesting
    permission: true
    visibility: brief
    description: "Validate bash, Python, and Go script nesting depth to enforce flat control flow"

  - name: gcloud-reauth
    permission: false
    visibility: brief
    description: "Check GCP application-default credentials and re-login if expired, with self-managed launchd agent"

  - name: get-secret
    permission: false
    visibility: brief
    description: "Interactively retrieves a secret from AWS Secrets Manager by listing and selecting"
