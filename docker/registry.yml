# Docker component registry — env var overrides for Colima runtime.
# Only rendered when colima is installed (install_check_command: colima).

meta:
  section: "Docker / Colima"
  install_check: true
  install_check_symlink: "${WORKBENCH_STATE_DIR}/docker-aliases.zsh"
  install_check_symlink_contains: "colima"
  validation: none

env:
  - var: COLIMA_PROFILE
    comment: "VM profile name"
    default: "default"
  # Deliberately no default: an entry with one is rendered into ~/.env.local as a
  # live `export`, which would pin every machine to a single architecture and
  # override the detection in docker/colima/aliases.zsh. Left blank, it renders
  # as a commented reference line and detection wins.
  - var: COLIMA_ARCH
    comment: "CPU architecture — unset means uname -m decides: arm64/aarch64 → aarch64, anything else → x86_64"
  - var: COLIMA_VM_TYPE
    comment: "Virtualization type (vz | qemu)"
    default: "vz"
  - var: COLIMA_ROSETTA
    comment: "Enable Rosetta for x86_64 emulation"
    default: "true"
  - var: COLIMA_CPU
    comment: "Number of CPUs"
    default: "4"
  - var: COLIMA_MEMORY
    comment: "Memory in GB"
    default: "8"

tools: []
