# Git script registry.
# Regenerate: generate-tool-context

meta:
  section: "Git Scripts"
  validation: bindir
  source: git/bin

tools:
  - name: generate-changelog
    permission: false
    visibility: hidden
    description: "Generates a changelog from conventional commits grouped by type"

  - name: wt-fetch-default
    permission: false
    visibility: hidden
    description: "Brings the local default branch up to date with origin's — the worktrunk pre-switch hook"
